name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened vs. what you expected?
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, macOS version, and unified memory
      placeholder: MacBook Pro M3 Max, macOS 15.4, 64 GB
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gemma4-mlx-mac doctor --json`
      description: Do not include tokens, private prompts, or private paths.
      render: json
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, model id, dataset shape, and sanitized error logs.
    validations:
      required: true
