[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gemma4-mlx-mac"
version = "0.1.0"
description = "Run, chat with, and fine-tune Gemma 4 locally on Apple Silicon with MLX unified memory."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "kili1" }
]
keywords = [
  "gemma",
  "gemma-4",
  "mlx",
  "apple-silicon",
  "local-ai",
  "finetuning",
  "lora",
  "macos"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: MacOS X",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "fastapi>=0.115",
  "huggingface-hub>=0.25",
  "httpx>=0.27",
  "pydantic>=2.8",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.31.2; platform_system == 'Darwin'",
  "mlx-lm[train]>=0.26.0; platform_system == 'Darwin'",
  "mlx-vlm>=0.1.0; platform_system == 'Darwin'"
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6"
]

[project.urls]
Homepage = "https://github.com/kili1/gemma4-mlx-mac"
Repository = "https://github.com/kili1/gemma4-mlx-mac"
Issues = "https://github.com/kili1/gemma4-mlx-mac/issues"
Documentation = "https://github.com/kili1/gemma4-mlx-mac/tree/main/docs"

[project.scripts]
gemma4-mlx-mac = "gemma4_mlx_mac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma4_mlx_mac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
